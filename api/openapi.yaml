openapi: 3.1.0
info:
  title: BookmarksSync API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  description: |
    Authenticated bookmark, account and administrator API. Cookie requests to unsafe
    methods require the exact configured Origin and X-CSRF-Token. Personal tokens are
    accepted only on operations declaring their exact x-token-scope.
    x-recent-auth marks session operations that return 403 reauthentication_required
    unless the session (re)authenticated within the last five minutes.
    Route availability depends on server configuration: every route except /version
    requires BOOKMARKSYNC_PUBLIC_URL; passkey routes require a configured WebAuthn
    relying party (reported by passkeysEnabled in /admin/system); /auth/oidc/* routes exist only when at least one provider is
    configured, and {provider} must name a configured provider. Unavailable routes
    answer 404.
servers:
  - url: /api/v1
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-bookmarksync_session
    personalToken:
      type: http
      scheme: bearer
      bearerFormat: bmt1
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
    OpenObject:
      type: object
      description: Extensible JSON object used for WebAuthn ceremony options.
      additionalProperties: true
    VersionResponse:
      type: object
      required: [version, commit, build_date]
      properties:
        version: {type: string}
        commit: {type: string}
        build_date: {type: string}
    AuthUser:
      type: object
      required: [id, username, isAdmin]
      properties:
        id: {type: integer, format: int64}
        username: {type: string}
        isAdmin: {type: boolean}
    Session:
      type: object
      required: [id, label, createdAt, lastSeenAt, authenticatedAt, idleExpiresAt, expiresAt, current]
      properties:
        id: {type: integer, format: int64}
        label: {type: string}
        createdAt: {type: string, format: date-time}
        lastSeenAt: {type: string, format: date-time}
        authenticatedAt: {type: string, format: date-time}
        idleExpiresAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        current: {type: boolean}
    AuthState:
      type: object
      required: [user, session, recentAuthUntil, csrfToken]
      properties:
        user: {$ref: '#/components/schemas/AuthUser'}
        session: {$ref: '#/components/schemas/Session'}
        recentAuthUntil: {type: string, format: date-time}
        csrfToken: {type: string}
    CSRFResponse:
      type: object
      required: [csrfToken]
      properties:
        csrfToken: {type: string}
    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions: {type: array, items: {$ref: '#/components/schemas/Session'}}
    SecondFactorRequired:
      type: object
      required: [status, flowId, methods, expiresAt]
      properties:
        status: {type: string, const: second_factor_required}
        flowId: {type: string}
        methods: {type: array, items: {type: string, enum: [totp, recoveryCode]}}
        expiresAt: {type: string, format: date-time}
    TOTPStatus:
      type: object
      required: [enabled, recoveryCodesRemaining]
      properties:
        enabled: {type: boolean}
        recoveryCodesRemaining: {type: integer, minimum: 0}
    TOTPEnrollment:
      type: object
      required: [secret, provisioningUri, algorithm, digits, period]
      properties:
        secret: {type: string}
        provisioningUri: {type: string, format: uri}
        algorithm: {type: string, const: SHA1}
        digits: {type: integer}
        period: {type: integer}
    RecoveryCodesResponse:
      type: object
      required: [recoveryCodes, csrfToken]
      properties:
        recoveryCodes: {type: array, items: {type: string}}
        csrfToken: {type: string}
    Ceremony:
      type: object
      required: [flowId, options, expiresAt]
      properties:
        flowId: {type: string}
        options: {$ref: '#/components/schemas/OpenObject'}
        expiresAt: {type: string, format: date-time}
    Passkey:
      type: object
      required: [id, name, createdAt, lastUsedAt, backupEligible, backupState, cloneWarning, transports]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        createdAt: {type: string, format: date-time}
        lastUsedAt: {type: [string, 'null'], format: date-time}
        backupEligible: {type: boolean}
        backupState: {type: boolean}
        cloneWarning: {type: boolean}
        transports: {type: array, items: {type: string}}
    PasskeyList:
      type: object
      required: [passkeys]
      properties:
        passkeys: {type: array, items: {$ref: '#/components/schemas/Passkey'}}
    PasskeyCreated:
      type: object
      required: [passkey, csrfToken]
      properties:
        passkey: {$ref: '#/components/schemas/Passkey'}
        csrfToken: {type: string}
    OIDCProvider:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
    OIDCProviderList:
      type: object
      required: [providers]
      properties:
        providers: {type: array, items: {$ref: '#/components/schemas/OIDCProvider'}}
    OIDCStart:
      type: object
      required: [authorizationUrl, expiresAt]
      properties:
        authorizationUrl: {type: string, format: uri}
        expiresAt: {type: string, format: date-time}
    OIDCIdentity:
      type: object
      required: [id, provider, displayName, createdAt, lastLoginAt]
      properties:
        id: {type: integer, format: int64}
        provider: {type: string}
        displayName: {type: string}
        createdAt: {type: string, format: date-time}
        lastLoginAt: {type: [string, 'null'], format: date-time}
    OIDCIdentityList:
      type: object
      required: [identities]
      properties:
        identities: {type: array, items: {$ref: '#/components/schemas/OIDCIdentity'}}
    User:
      type: object
      required: [id, username, isAdmin, active, createdAt, lastContactAt]
      properties:
        id: {type: integer, format: int64}
        username: {type: string}
        isAdmin: {type: boolean}
        active: {type: boolean}
        createdAt: {type: string, format: date-time}
        lastContactAt: {type: [string, 'null'], format: date-time}
    BasicUser:
      type: object
      required: [id, username, isAdmin, createdAt]
      properties:
        id: {type: integer, format: int64}
        username: {type: string}
        isAdmin: {type: boolean}
        createdAt: {type: string, format: date-time}
    SettingsResponse:
      type: object
      required: [settings]
      properties:
        settings: {type: object, additionalProperties: {type: string}}
    Token:
      type: object
      required: [id, label, scopes, createdAt, expiresAt, lastUsedAt, revoked, expired]
      properties:
        id: {type: integer, format: int64}
        label: {type: string}
        scopes: {type: array, items: {type: string, enum: ['bookmarks:read', 'bookmarks:write', 'shares:read', 'shares:manage']}}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: [string, 'null'], format: date-time}
        lastUsedAt: {type: [string, 'null'], format: date-time}
        revoked: {type: boolean}
        expired: {type: boolean}
    TokenList:
      type: object
      required: [tokens]
      properties:
        tokens: {type: array, items: {$ref: '#/components/schemas/Token'}}
    TokenCreated:
      type: object
      required: [token, secret]
      properties:
        token: {$ref: '#/components/schemas/Token'}
        secret: {type: string, description: Displayed only once.}
    Connection:
      type: object
      required: [id, label, kind, shareId, mode, createdAt, lastUsedAt, revoked]
      properties:
        id: {type: integer, format: int64}
        label: {type: string}
        kind: {type: string, enum: [private, share]}
        shareId: {type: integer, format: int64}
        mode: {type: string, enum: [view, edit]}
        createdAt: {type: string, format: date-time}
        lastUsedAt: {type: [string, 'null'], format: date-time}
        revoked: {type: boolean}
    ConnectionResponse:
      type: object
      required: [connection]
      properties:
        connection: {$ref: '#/components/schemas/Connection'}
    ConnectionRenameRequest:
      type: object
      required: [label]
      additionalProperties: false
      properties:
        label: {type: string, minLength: 1, maxLength: 200, description: 'Connection name; surrounding white space is trimmed and the result must be 1-200 characters without control characters.'}
    ConnectionList:
      type: object
      required: [connections]
      properties:
        connections: {type: array, items: {$ref: '#/components/schemas/Connection'}}
    ConnectionCreated:
      type: object
      required: [connection, secret]
      properties:
        connection:
          type: object
          required: [id, label, kind, shareId, mode]
          properties:
            id: {type: integer, format: int64}
            label: {type: string}
            kind: {type: string, enum: [private, share]}
            shareId: {type: integer, format: int64}
            mode: {type: string, enum: [view, edit]}
        secret: {type: string, description: Displayed only once.}
    Bookmark:
      type: object
      required: [id, url, title, tags, folders, favorite]
      properties:
        id: {type: integer, format: int64}
        url: {type: string}
        title: {type: string}
        tags: {type: array, items: {type: string}}
        folders: {type: array, items: {type: integer, format: int64}}
        favorite: {type: boolean, description: "The caller's own favorite state for this bookmark. Favorites are per user and per bookmark record, so the value is the same in every folder placement; they are not part of Floccus sync."}
    BookmarkPage:
      type: object
      required: [items, page, limit, hasMore]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Bookmark'}}
        page: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 200}
        hasMore: {type: boolean}
    Folder:
      type: object
      required: [id, parentId, title, position, canonical]
      properties:
        id: {type: integer, format: int64}
        parentId: {type: integer, format: int64}
        title: {type: string}
        position: {type: integer}
        canonical: {type: boolean}
    FolderNode:
      type: object
      required: [id, type, title]
      properties:
        id: {type: integer, format: int64}
        type: {type: string, enum: [folder, bookmark]}
        title: {type: string}
        url: {type: string}
        loaded: {type: boolean}
        children: {type: array, items: {$ref: '#/components/schemas/FolderNode'}}
    FolderTree:
      type: object
      required: [folders]
      properties:
        folders: {type: array, items: {$ref: '#/components/schemas/FolderNode'}}
    Tag:
      type: object
      required: [name, count]
      properties:
        name: {type: string}
        count: {type: integer, minimum: 0}
    TagList:
      type: object
      required: [tags]
      properties:
        tags: {type: array, items: {$ref: '#/components/schemas/Tag'}}
    DuplicateGroup:
      type: object
      required: [url, bookmarks]
      properties:
        url: {type: string, description: The exact URL shared by every record in the group.}
        bookmarks:
          type: array
          minItems: 2
          description: Distinct bookmark records visible to the caller that hold this URL, ordered by id. Folder placements of one record are never listed as separate records.
          items: {$ref: '#/components/schemas/Bookmark'}
    DuplicateList:
      type: object
      required: [count, groups, page, limit, hasMore]
      properties:
        count: {type: integer, minimum: 0, description: "Excess distinct records over all groups visible to the caller (a URL held by three records adds two), independent of the page returned."}
        groups: {type: array, items: {$ref: '#/components/schemas/DuplicateGroup'}}
        page: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 1000}
        hasMore: {type: boolean}
    LinkCheckRequest:
      type: object
      required: [bookmarkIds]
      additionalProperties: false
      properties:
        bookmarkIds: {type: array, minItems: 1, maxItems: 50, uniqueItems: true, items: {type: integer, format: int64, minimum: 1}}
    LinkCheckResult:
      type: object
      required: [bookmarkId, url, status, httpStatus, detail, redirects, checkedAt]
      properties:
        bookmarkId: {type: integer, format: int64}
        url: {type: string, description: The URL as stored when the job was submitted.}
        status:
          type: string
          enum: [pending, ok, broken, skipped, excluded, blocked, error]
          description: "pending until checked; ok = final response below 400; broken = 400 or above; skipped = not an http(s) URL; excluded = matched the user's linkcheck.exclusions (not contacted); blocked = destination refused by the public-only rules; error = DNS, connection, TLS, timeout or redirect-limit failure."
        httpStatus: {type: [integer, 'null'], description: Final HTTP status when a response was received.}
        detail: {type: string, description: Short machine-readable reason (for example timeout, too_many_redirects, non_public_address). Never contains a URL.}
        redirects: {type: integer, minimum: 0, maximum: 5}
        checkedAt: {type: [string, 'null'], format: date-time}
    LinkCheckJob:
      type: object
      required: [id, status, total, done, createdAt, startedAt, finishedAt, results]
      properties:
        id: {type: integer, format: int64}
        status: {type: string, enum: [queued, running, completed]}
        total: {type: integer, minimum: 1, maximum: 50}
        done: {type: integer, minimum: 0, description: Results that are no longer pending.}
        createdAt: {type: string, format: date-time}
        startedAt: {type: [string, 'null'], format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
        results: {type: array, items: {$ref: '#/components/schemas/LinkCheckResult'}}
    RecentChange:
      type: object
      required: [type, id, title, url, at]
      properties:
        type: {type: string, enum: [created, updated, deleted], description: "Current state of the record: deleted (in the Trash, deleted inside the window), else created (created inside the window), else updated (edited inside the window). Each record appears once."}
        id: {type: integer, format: int64}
        title: {type: string}
        url: {type: string}
        at: {type: string, format: date-time, description: The timestamp that decided the type.}
    RecentChanges:
      type: object
      required: [since, windowDays, counts, items, page, limit, hasMore]
      properties:
        since: {type: string, format: date-time, description: Start of the window (inclusive).}
        windowDays: {type: integer, const: 7}
        counts:
          type: object
          required: [created, updated, deleted]
          description: Counts over the whole window, independent of the page returned.
          properties:
            created: {type: integer, minimum: 0}
            updated: {type: integer, minimum: 0}
            deleted: {type: integer, minimum: 0}
        items: {type: array, items: {$ref: '#/components/schemas/RecentChange'}, description: "One page, newest first. Reports current item state, not a full event history; placement-only edits are not changes."}
        page: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 200}
        hasMore: {type: boolean}
    DashboardSummary:
      type: object
      required: [totalBookmarks, duplicateCount, lastContactAt, recentChanges]
      properties:
        totalBookmarks: {type: integer, minimum: 0, description: Distinct live bookmark records in the caller's own collection; a record in several folders counts once.}
        duplicateCount: {type: integer, minimum: 0, description: "Excess distinct records sharing an exact URL (see GET /duplicates)."}
        lastContactAt: {type: [string, "null"], format: date-time, description: Most recent use of any of the caller's Floccus connections; null if none was ever used.}
        recentChanges: {$ref: '#/components/schemas/RecentChanges'}
    TrashItem:
      type: object
      required: [type, id, title, url, deletedAt, purgeAt]
      properties:
        type: {type: string, enum: [bookmark, folder]}
        id: {type: integer, format: int64}
        title: {type: string}
        url: {type: string}
        deletedAt: {type: string, format: date-time}
        purgeAt: {type: string, format: date-time}
    TrashPage:
      type: object
      required: [items, page, limit, hasMore]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/TrashItem'}}
        page: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 1000}
        hasMore: {type: boolean}
    RestoredItem:
      type: object
      required: [item]
      properties:
        item: {$ref: '#/components/schemas/FolderNode'}
    ImportResult:
      type: object
      required: [imported, folders]
      properties:
        imported: {type: integer, minimum: 0}
        folders: {type: array, items: {$ref: '#/components/schemas/FolderNode'}}
    Share:
      type: object
      required: [id, ownerId, folderId, recipientId, mode, folderTitle]
      properties:
        id: {type: integer, format: int64}
        ownerId: {type: integer, format: int64}
        folderId: {type: integer, format: int64}
        recipientId: {type: integer, format: int64}
        mode: {type: string, enum: [view, edit]}
        folderTitle: {type: string}
    ShareList:
      type: object
      required: [shares]
      properties:
        shares: {type: array, items: {$ref: '#/components/schemas/Share'}}
    AdminUser:
      allOf:
        - {$ref: '#/components/schemas/User'}
        - type: object
          required: [bookmarkCount, folderCount, storageBytes, connectionCount, themeDefault]
          properties:
            bookmarkCount: {type: integer, minimum: 0}
            folderCount: {type: integer, minimum: 0}
            storageBytes: {type: integer, format: int64, minimum: 0}
            connectionCount: {type: integer, minimum: 0}
            themeDefault: {type: [string, 'null'], enum: [classic, ocean-glass, midnight-glass, warm-glass, null]}
    AdminUserPage:
      type: object
      required: [users, page, limit, hasMore]
      properties:
        users: {type: array, items: {$ref: '#/components/schemas/AdminUser'}}
        page: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 200}
        hasMore: {type: boolean}
    AdminSystem:
      type: object
      required: [version, publicOrigin, passkeysEnabled, oidcProviders, users, bookmarks, storageBytes]
      properties:
        version: {type: string}
        publicOrigin: {type: string}
        passkeysEnabled: {type: boolean}
        oidcProviders: {type: array, items: {type: string}}
        users:
          type: object
          required: [total, active, admins]
          properties:
            total: {type: integer}
            active: {type: integer}
            admins: {type: integer}
        bookmarks:
          type: object
          required: [total]
          properties:
            total: {type: integer}
        storageBytes: {type: integer, format: int64, minimum: 0}
    HealthUsage:
      type: object
      required: [totalBytes, usedBytes, percent]
      properties:
        totalBytes: {type: integer, format: uint64, minimum: 0}
        usedBytes: {type: integer, format: uint64, minimum: 0}
        percent: {type: number, minimum: 0, maximum: 100}
    AdminHealth:
      type: object
      required: [cpuPercent, memory, disk, uptimeSeconds, unavailable, dbReady, syncErrors]
      properties:
        cpuPercent: {type: [number, 'null'], minimum: 0, maximum: 100}
        memory: {anyOf: [{$ref: '#/components/schemas/HealthUsage'}, {type: 'null'}]}
        disk: {anyOf: [{$ref: '#/components/schemas/HealthUsage'}, {type: 'null'}]}
        uptimeSeconds: {type: [integer, 'null'], format: uint64, minimum: 0}
        unavailable: {type: array, items: {type: string, enum: [cpu, memory, disk, uptime]}}
        dbReady: {type: boolean}
        syncErrors: {type: integer, format: uint64, minimum: 0, description: Process-lifetime failed Floccus requests returning a server error.}
    UpdateRelease:
      required: [tag, commit, publishedAt, url]
      properties:
        tag: {type: string, pattern: '^build-[0-9a-f]{40}$'}
        commit: {type: string, pattern: '^[0-9a-f]{40}$'}
        publishedAt: {type: string, format: date-time}
        url: {type: string, format: uri}
      type: object
    UpdateCatalog:
      required: [releases, updateAvailable, applyAvailable]
      properties:
        installedCommit: {type: string, pattern: '^[0-9a-f]{40}$'}
        releases: {type: array, items: {$ref: '#/components/schemas/UpdateRelease'}}
        latest: {$ref: '#/components/schemas/UpdateRelease'}
        updateAvailable: {type: boolean}
        applyAvailable: {type: boolean}
      type: object
    UpdateApproval:
      required: [status, tag, job]
      properties:
        status: {type: string, enum: [accepted]}
        tag: {type: string, pattern: '^build-[0-9a-f]{40}$'}
        job: {type: string, pattern: '^bookmarksync-update-[0-9a-f]{40}$'}
      type: object
    UpdateApprovalRequest:
      additionalProperties: false
      required: [tag]
      properties:
        tag: {type: string, pattern: '^build-[0-9a-f]{40}$'}
      type: object
    SystemSettingsResponse:
      type: object
      required: [settings]
      properties:
        settings: {type: object, additionalProperties: {type: string}}
    NetworkAccessPolicy:
      type: object
      required: [mode, countries, geoDatabaseAvailable, geoDatabaseBuildTime, trustedProxyCount]
      properties:
        mode: {type: string, enum: [allow, block]}
        countries: {type: array, items: {type: string, pattern: '^[A-Z]{2}$'}}
        geoDatabaseAvailable: {type: boolean}
        geoDatabaseBuildTime: {type: [string, 'null'], format: date-time}
        trustedProxyCount: {type: integer, minimum: 0}
    NetworkAccessPolicyPatch:
      type: object
      required: [mode, countries]
      additionalProperties: false
      properties:
        mode: {type: string, enum: [allow, block]}
        countries: {type: array, items: {type: string, pattern: '^[A-Za-z]{2}$'}}
    PublicPresentation:
      type: object
      required: [appTitle, signinTitle, tagline, supportingLine, loginLayout, primaryColor, accentColor, backgroundColor, version, copyright]
      properties:
        appTitle: {type: string}
        signinTitle: {type: string}
        tagline: {type: string}
        supportingLine: {type: string}
        loginLayout: {type: string, enum: [split, centered, plain]}
        primaryColor: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        accentColor: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        backgroundColor: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        version: {type: string}
        copyright: {type: string}
        logoUrl: {type: string, format: uri-reference}
        backgroundUrl: {type: string, format: uri-reference}
    BrandingAssetUpload:
      type: object
      required: [url, settings]
      properties:
        url: {type: string, format: uri-reference}
        settings: {type: object, additionalProperties: {type: string}}
    AdminActivityItem:
      type: object
      required: [id, actorId, action, targetType, targetId, createdAt]
      properties:
        id: {type: integer, format: int64}
        actorId: {type: integer, format: int64, minimum: 0}
        action: {type: string, enum: [user_created, user_updated, user_settings_updated, system_settings_updated, branding_asset_uploaded, connection_revoked, password_reset, factor_reset, backup_schedule_updated, backup_run_started, backup_destination_created, backup_destination_updated, backup_destination_deleted, software_update_approved]}
        targetType: {type: string, enum: [user, system, asset, backup, backup_destination]}
        targetId: {type: [integer, 'null'], format: int64, minimum: 1}
        createdAt: {type: string, format: date-time}
    AdminActivity:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AdminActivityItem'}}
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string}
        password: {type: string, format: password}
    SecondFactorRequest:
      type: object
      required: [flowId]
      oneOf:
        - required: [code]
        - required: [recoveryCode]
      properties:
        flowId: {type: string}
        code: {type: string}
        recoveryCode: {type: string}
    ReauthenticateRequest:
      type: object
      required: [password]
      properties:
        password: {type: string, format: password}
    PasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      additionalProperties: false
      properties:
        currentPassword: {type: string, format: password}
        newPassword: {type: string, format: password}
    SettingsPatchRequest:
      type: object
      additionalProperties: {type: [string, 'null']}
      description: "Whitelisted settings with string values; unknown keys are rejected. dashboard.layout is a validated JSON array (stored as a string) describing the total, recent, sync and duplicates widgets. ui.theme accepts classic, ocean-glass, midnight-glass or warm-glass; ui.color-scheme accepts light or dark; ui.reduced-transparency accepts true or false. linkcheck.exclusions is a JSON array (as a string) of at most 100 domains, IP addresses or CIDR ranges, for example '[\"example.com\", \"203.0.113.0/24\"]'; a domain also matches its subdomains. Exclusions only skip link checks and never allow a private destination."
    TokenCreateRequest:
      type: object
      required: [scopes]
      additionalProperties: false
      properties:
        label: {type: string, description: Optional display label.}
        scopes: {type: array, items: {type: string, enum: ['bookmarks:read', 'bookmarks:write', 'shares:read', 'shares:manage']}}
        expiresAt: {type: string, format: date-time}
    ConnectionCreateRequest:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        label: {type: string}
        mode: {type: string, enum: [view, edit]}
        shareId: {type: integer, format: int64}
    BulkMoveRequest:
      type: object
      required: [bookmarkIds, sourceFolderId, folderId]
      additionalProperties: false
      properties:
        bookmarkIds: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {type: integer, format: int64, minimum: 1}}
        sourceFolderId: {type: integer, format: int64, minimum: 1, description: Folder holding the placement to move.}
        folderId: {type: integer, format: int64, minimum: 1, description: Destination folder.}
    BookmarkCreateRequest:
      type: object
      required: [url, title, folders]
      additionalProperties: false
      properties:
        url: {type: string}
        title: {type: string}
        folders: {type: array, items: {type: integer, format: int64}}
        tags: {type: [array, 'null'], items: {type: string}}
    BookmarkUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        url: {type: [string, 'null']}
        title: {type: [string, 'null']}
        folders: {type: [array, 'null'], items: {type: integer, format: int64}}
        tags: {type: [array, 'null'], items: {type: string}}
    FolderCreateRequest:
      type: object
      required: [parentId, title]
      additionalProperties: false
      properties:
        parentId:
          type: integer
          format: int64
          description: Required parent folder id. Use -1 for the selected collection root.
          anyOf:
            - {const: -1}
            - {minimum: 1}
        title: {type: string}
    FolderUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        parentId: {type: [integer, 'null'], format: int64}
        title: {type: [string, 'null']}
    ChildRef:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: {type: string, enum: [folder, bookmark]}
        id: {type: integer, format: int64}
    ChildOrderRequest:
      type: object
      required: [children]
      additionalProperties: false
      properties:
        children: {type: array, items: {$ref: '#/components/schemas/ChildRef'}}
    ShareCreateRequest:
      type: object
      required: [folderId, recipient, mode]
      additionalProperties: false
      properties:
        folderId: {type: integer, format: int64}
        recipient: {type: string}
        mode: {type: string, enum: [view, edit]}
    ShareUpdateRequest:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode: {type: string, enum: [view, edit]}
    UserCreateRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: {type: string}
        password: {type: string, format: password}
        isAdmin: {type: boolean}
    UserUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        active: {type: [boolean, 'null']}
        isAdmin: {type: [boolean, 'null']}
    TOTPCodeRequest:
      type: object
      required: [code]
      properties:
        code: {type: string}
    TOTPProofRequest:
      type: object
      oneOf:
        - required: [code]
        - required: [recoveryCode]
      properties:
        code: {type: string}
        recoveryCode: {type: string}
    CeremonyRequest:
      type: object
      required: [flowId, credential]
      properties:
        flowId: {type: string}
        name: {type: string}
        credential: {$ref: '#/components/schemas/OpenObject'}
    PasskeyRegistrationFinishRequest:
      type: object
      required: [flowId, credential]
      properties:
        flowId: {type: string}
        name: {type: string, description: Optional display name; defaults to Passkey when omitted.}
        credential: {$ref: '#/components/schemas/OpenObject'}
    RenamePasskeyRequest:
      type: object
      required: [name]
      properties:
        name: {type: string}
    PasswordResetRequest:
      type: object
      required: [newPassword]
      additionalProperties: false
      properties:
        newPassword: {type: string, format: password}
    FactorResetRequest:
      type: object
      additionalProperties: false
      properties:
        totp: {type: boolean}
        passkeys: {type: boolean}
        oidc: {type: boolean}
    ImportUpload:
      type: object
      required: [file]
      properties:
        file: {type: string, format: binary, description: Netscape HTML or XBEL upload.}
    BackupSchedule:
      type: object
      required: [weeklyEnabled, monthlyEnabled, timezone, weeklyDay, weeklyHour, weeklyMinute, monthlyDay, monthlyHour, monthlyMinute, weeklyRetention, monthlyRetention]
      properties:
        weeklyEnabled: {type: boolean}
        monthlyEnabled: {type: boolean}
        timezone: {type: string, description: IANA time zone name.}
        weeklyDay: {type: integer, minimum: 0, maximum: 6, description: Sunday is 0.}
        weeklyHour: {type: integer, minimum: 0, maximum: 23}
        weeklyMinute: {type: integer, minimum: 0, maximum: 59}
        monthlyDay: {type: integer, minimum: 1, maximum: 28}
        monthlyHour: {type: integer, minimum: 0, maximum: 23}
        monthlyMinute: {type: integer, minimum: 0, maximum: 59}
        weeklyRetention: {type: integer, minimum: 1, maximum: 100}
        monthlyRetention: {type: integer, minimum: 1, maximum: 100}
    BackupDestination:
      type: object
      required: [label, kind, reference, enabled]
      properties:
        id: {type: string, pattern: '^[0-9a-f]{16,64}$'}
        label: {type: string, maxLength: 80}
        kind: {type: string, enum: [local, nfs, rclone]}
        reference: {type: string, maxLength: 1024, description: Host path or configured rclone remote path; credentials stay on the host.}
        enabled: {type: boolean}
        encrypted: {type: boolean, default: false, description: Encrypt archive files stored at this destination with a destination-specific recovery key.}
        hasRecoveryKey: {type: boolean, readOnly: true, description: A recovery key is stored separately from system backup archives.}
    BackupRun:
      type: object
      required: [id, batchId, trigger, destinationId, destinationLabel, archiveName, state, sizeBytes, startedAt]
      properties:
        id: {type: integer, format: int64}
        batchId: {type: string}
        trigger: {type: string, enum: [manual, weekly, monthly]}
        destinationId: {type: string}
        destinationLabel: {type: string}
        archiveName: {type: string}
        state: {type: string, enum: [running, succeeded, failed]}
        sizeBytes: {type: integer, format: int64}
        errorCode: {type: string}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
    BackupSnapshot:
      type: object
      required: [schedule, destinations, runs, running]
      properties:
        schedule: {$ref: '#/components/schemas/BackupSchedule'}
        destinations: {type: array, items: {$ref: '#/components/schemas/BackupDestination'}}
        runs: {type: array, items: {$ref: '#/components/schemas/BackupRun'}}
        running: {type: boolean}
    NotificationAdminSettings:
      type: object
      required: [smtp, telegram, adminAlerts, deliveryFailures, userDeliveryFailures]
      properties:
        smtp: {type: object, required: [host, port, tlsMode, from, recipient, configured, authenticationConfigured], properties: {host: {type: string}, port: {type: integer}, tlsMode: {type: string, enum: [tls, starttls]}, from: {type: string}, recipient: {type: string, format: email}, configured: {type: boolean}, authenticationConfigured: {type: boolean}}}
        telegram: {type: object, required: [configured, chatConfigured], properties: {configured: {type: boolean}, chatConfigured: {type: boolean}}}
        adminAlerts: {type: object, required: [backupSuccess, backupFailure, security], properties: {backupSuccess: {type: boolean}, backupFailure: {type: boolean}, security: {type: boolean}}}
        deliveryFailures: {type: integer, format: int64, minimum: 0, description: Provider delivery failures since process start.}
        userDeliveryFailures: {type: integer, format: int64, minimum: 0, description: User notification delivery failures since process start.}
    UserNotificationChannel:
      type: object
      required: [kind, destination, verifiedAt]
      properties:
        kind: {type: string, enum: [email, telegram]}
        destination: {type: string}
        verifiedAt: {type: string, format: date-time}
    UserNotificationSettings:
      type: object
      required: [channels, securityAlerts, sharingAlerts]
      properties:
        channels: {type: array, items: {$ref: '#/components/schemas/UserNotificationChannel'}}
        securityAlerts: {type: boolean}
        sharingAlerts: {type: boolean}
    UserNotificationPreferences:
      type: object
      required: [securityAlerts, sharingAlerts]
      additionalProperties: false
      properties:
        securityAlerts: {type: boolean}
        sharingAlerts: {type: boolean}
    NotificationBindingRequest:
      type: object
      required: [kind, destination]
      additionalProperties: false
      properties:
        kind: {type: string, enum: [email, telegram]}
        destination: {type: string, maxLength: 254}
    NotificationBindingConfirm:
      type: object
      required: [kind, code]
      additionalProperties: false
      properties:
        kind: {type: string, enum: [email, telegram]}
        code: {type: string, pattern: '^[0-9]{8}$'}
    NotificationBindingStarted:
      type: object
      required: [status]
      properties:
        status: {type: string, const: verification_sent}
    NotificationAdminUpdate:
      type: object
      additionalProperties: false
      properties:
        smtp: {type: object, additionalProperties: false, properties: {host: {type: string, maxLength: 253}, port: {type: integer, minimum: 1, maximum: 65535}, tlsMode: {type: string, enum: [tls, starttls]}, username: {type: string, maxLength: 256}, password: {type: string, maxLength: 1024, writeOnly: true}, from: {type: string, maxLength: 320}, recipient: {type: string, format: email, maxLength: 320}, clearPassword: {type: boolean}, clear: {type: boolean}}}
        telegram: {type: object, additionalProperties: false, properties: {botToken: {type: string, maxLength: 256, writeOnly: true}, chatId: {type: string, maxLength: 24}, clear: {type: boolean}}}
        adminAlerts: {type: object, additionalProperties: false, properties: {backupSuccess: {type: boolean}, backupFailure: {type: boolean}, security: {type: boolean}}}
    NotificationTestRequest:
      type: object
      required: [channel]
      additionalProperties: false
      properties:
        channel: {type: string, enum: [smtp, telegram]}
    NotificationTestResult:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ok]}
    BackupBatchAccepted:
      type: object
      required: [batchId, status]
      properties:
        batchId: {type: string}
        status: {type: string, const: accepted}
    BackupTestResult:
      type: object
      required: [status]
      properties:
        status: {type: string, const: ok}
  responses:
    Error:
      description: Standard JSON error response.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
paths:
  /version: {get: {operationId: getVersion, security: [], responses: {"200": {content: {application/json: {schema: {$ref: '#/components/schemas/VersionResponse'}}}, description: Successful response.}, default: {$ref: '#/components/responses/Error'}}, summary: Get Version}}
  /auth/login: {post: {operationId: passwordLogin, security: [], requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}, required: true}, responses: {"200": {content: {application/json: {schema: {$ref: '#/components/schemas/AuthState'}}}, description: Successful response.}, "202": {content: {application/json: {schema: {$ref: '#/components/schemas/SecondFactorRequired'}}}, description: Successful response.}, default: {$ref: '#/components/responses/Error'}}, summary: Password Login}}
  /auth/logout: {post: {operationId: logout, security: [{sessionCookie: []}], responses: {"204": {description: No content.}, default: {$ref: '#/components/responses/Error'}}, summary: Logout}}
  /auth/session: {get: {operationId: currentSession, security: [{sessionCookie: []}], responses: {"200": {content: {application/json: {schema: {$ref: '#/components/schemas/AuthState'}}}, description: Successful response.}, default: {$ref: '#/components/responses/Error'}}, summary: Current Session}}
  /auth/csrf: {get: {operationId: csrfBootstrap, security: [{sessionCookie: []}], responses: {"200": {content: {application/json: {schema: {$ref: '#/components/schemas/CSRFResponse'}}}, description: Successful response.}, default: {$ref: '#/components/responses/Error'}}, summary: Csrf Bootstrap}}
  /auth/sessions: {get: {operationId: listSessions, security: [{sessionCookie: []}], responses: {"200": {content: {application/json: {schema: {$ref: '#/components/schemas/SessionList'}}}, description: Successful response.}, default: {$ref: '#/components/responses/Error'}}, summary: List Sessions}}
  /auth/sessions/{id}: {delete: {operationId: revokeSession, security: [{sessionCookie: []}], responses: {"204": {description: No content.}, default: {$ref: '#/components/responses/Error'}}, summary: Revoke Session, parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}]}}
  /auth/reauthenticate: {post: {operationId: reauthenticate, security: [{sessionCookie: []}], requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/ReauthenticateRequest'}}}, required: true}, responses: {"200": {content: {application/json: {schema: {$ref: '#/components/schemas/AuthState'}}}, description: Successful response.}, default: {$ref: '#/components/responses/Error'}}, summary: Reauthenticate}}
  /auth/login/second-factor: {post: {operationId: completeSecondFactorLogin, security: [], requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/SecondFactorRequest'}}}, required: true}, responses: {"200": {content: {application/json: {schema: {$ref: '#/components/schemas/AuthState'}}}, description: Successful response.}, default: {$ref: '#/components/responses/Error'}}, summary: Complete Second Factor Login}}
  /auth/totp: {get: {operationId: totpStatus, security: [{sessionCookie: []}], responses: {"200": {content: {application/json: {schema: {$ref: '#/components/schemas/TOTPStatus'}}}, description: Successful response.}, default: {$ref: '#/components/responses/Error'}}, summary: TOTP Status}}
  /auth/totp/enroll: {post: {operationId: beginTotpEnrollment, security: [{sessionCookie: []}], x-recent-auth: true, responses: {"200": {content: {application/json: {schema: {$ref: '#/components/schemas/TOTPEnrollment'}}}, description: Successful response.}, default: {$ref: '#/components/responses/Error'}}, summary: Begin TOTP Enrollment}}
  /auth/totp/confirm: {post: {operationId: confirmTotpEnrollment, security: [{sessionCookie: []}], x-recent-auth: true, requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/TOTPCodeRequest'}}}, required: true}, responses: {"200": {content: {application/json: {schema: {$ref: '#/components/schemas/RecoveryCodesResponse'}}}, description: Successful response.}, default: {$ref: '#/components/responses/Error'}}, summary: Confirm TOTP Enrollment}}
  /auth/totp/disable: {post: {operationId: disableTotp, security: [{sessionCookie: []}], x-recent-auth: true, requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/TOTPProofRequest'}}}, required: true}, responses: {"200": {content: {application/json: {schema: {$ref: '#/components/schemas/CSRFResponse'}}}, description: Successful response.}, default: {$ref: '#/components/responses/Error'}}, summary: Disable TOTP}}
  /auth/recovery-codes: {post: {operationId: regenerateRecoveryCodes, security: [{sessionCookie: []}], x-recent-auth: true, requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/TOTPCodeRequest'}}}, required: true}, responses: {"200": {content: {application/json: {schema: {$ref: '#/components/schemas/RecoveryCodesResponse'}}}, description: Successful response.}, default: {$ref: '#/components/responses/Error'}}, summary: Regenerate Recovery Codes}}
  /auth/passkey/login/begin: {post: {operationId: beginPasskeyLogin, security: [], responses: {"200": {content: {application/json: {schema: {$ref: '#/components/schemas/Ceremony'}}}, description: Successful response.}, default: {$ref: '#/components/responses/Error'}}, summary: Begin Passkey Login}}
  /auth/passkey/login/finish: {post: {operationId: finishPasskeyLogin, security: [], requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/CeremonyRequest'}}}, required: true}, responses: {"200": {content: {application/json: {schema: {$ref: '#/components/schemas/AuthState'}}}, description: Successful response.}, default: {$ref: '#/components/responses/Error'}}, summary: Finish Passkey Login}}
  /auth/passkeys: {get: {operationId: listPasskeys, security: [{sessionCookie: []}], responses: {"200": {content: {application/json: {schema: {$ref: '#/components/schemas/PasskeyList'}}}, description: Successful response.}, default: {$ref: '#/components/responses/Error'}}, summary: List Passkeys}}
  /auth/passkeys/register/begin: {post: {operationId: beginPasskeyRegistration, security: [{sessionCookie: []}], x-recent-auth: true, responses: {"200": {content: {application/json: {schema: {$ref: '#/components/schemas/Ceremony'}}}, description: Successful response.}, default: {$ref: '#/components/responses/Error'}}, summary: Begin Passkey Registration}}
  /auth/passkeys/register/finish: {post: {operationId: finishPasskeyRegistration, security: [{sessionCookie: []}], x-recent-auth: true, requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/PasskeyRegistrationFinishRequest'}}}, required: true}, responses: {"201": {content: {application/json: {schema: {$ref: '#/components/schemas/PasskeyCreated'}}}, description: Successful response.}, default: {$ref: '#/components/responses/Error'}}, summary: Finish Passkey Registration}}
  /auth/passkeys/{id}: {patch: {operationId: renamePasskey, security: [{sessionCookie: []}], requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/RenamePasskeyRequest'}}}, required: true}, responses: {"204": {description: No content.}, default: {$ref: '#/components/responses/Error'}}, summary: Rename Passkey, parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}]}, delete: {operationId: deletePasskey, security: [{sessionCookie: []}], x-recent-auth: true, responses: {"200": {content: {application/json: {schema: {$ref: '#/components/schemas/CSRFResponse'}}}, description: Successful response.}, default: {$ref: '#/components/responses/Error'}}, summary: Delete Passkey, parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}]}}
  /auth/oidc/providers: {get: {operationId: listOidcProviders, security: [], responses: {"200": {content: {application/json: {schema: {$ref: '#/components/schemas/OIDCProviderList'}}}, description: Successful response.}, default: {$ref: '#/components/responses/Error'}}, summary: List OIDC Providers}}
  /auth/oidc/{provider}/login: {post: {operationId: beginOidcLogin, security: [], responses: {"200": {content: {application/json: {schema: {$ref: '#/components/schemas/OIDCStart'}}}, description: Successful response.}, default: {$ref: '#/components/responses/Error'}}, summary: Begin OIDC Login, parameters: [{name: provider, in: path, required: true, schema: {type: string}}]}}
  /auth/oidc/{provider}/link: {post: {operationId: beginOidcLink, security: [{sessionCookie: []}], x-recent-auth: true, responses: {"200": {content: {application/json: {schema: {$ref: '#/components/schemas/OIDCStart'}}}, description: Successful response.}, default: {$ref: '#/components/responses/Error'}}, summary: Begin OIDC Link, parameters: [{name: provider, in: path, required: true, schema: {type: string}}]}}
  /auth/oidc/{provider}/callback: {get: {operationId: finishOidcFlow, security: [], responses: {"303": {description: OIDC callback redirect., headers: {Location: {schema: {format: uri, type: string}}}}, default: {$ref: '#/components/responses/Error'}}, parameters: [{in: query, name: state, required: false, schema: {type: string}}, {in: query, name: code, required: false, schema: {type: string}}, {in: query, name: error, required: false, schema: {type: string}}, {name: provider, in: path, required: true, schema: {type: string}}], summary: Finish OIDC Flow}}
  /auth/oidc/identities: {get: {operationId: listOidcIdentities, security: [{sessionCookie: []}], responses: {"200": {content: {application/json: {schema: {$ref: '#/components/schemas/OIDCIdentityList'}}}, description: Successful response.}, default: {$ref: '#/components/responses/Error'}}, summary: List OIDC Identities}}
  /auth/oidc/identities/{id}: {delete: {operationId: unlinkOidcIdentity, security: [{sessionCookie: []}], x-recent-auth: true, responses: {"200": {content: {application/json: {schema: {$ref: '#/components/schemas/CSRFResponse'}}}, description: Successful response.}, default: {$ref: '#/components/responses/Error'}}, summary: Unlink OIDC Identity, parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}]}}
  /me: {get: {operationId: getMe, security: [{sessionCookie: []}, {personalToken: []}], responses: {"200": {content: {application/json: {schema: {$ref: '#/components/schemas/BasicUser'}}}, description: Successful response.}, default: {$ref: '#/components/responses/Error'}}, summary: Get Me}}
  /me/notifications:
    get: {operationId: getMyNotifications, security: [{sessionCookie: []}], responses: {"200": {content: {application/json: {schema: {$ref: '#/components/schemas/UserNotificationSettings'}}}, description: Verified channels and preferences for the signed-in account.}, default: {$ref: '#/components/responses/Error'}}, summary: Get Notification Settings}
    patch: {operationId: updateMyNotificationPreferences, security: [{sessionCookie: []}], requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/UserNotificationPreferences'}}}, required: true}, responses: {"200": {content: {application/json: {schema: {$ref: '#/components/schemas/UserNotificationSettings'}}}, description: Updated user notification preferences.}, default: {$ref: '#/components/responses/Error'}}, summary: Update Notification Preferences}
  /me/notifications/bindings: {post: {operationId: beginNotificationBinding, security: [{sessionCookie: []}], requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/NotificationBindingRequest'}}}, required: true}, responses: {"202": {content: {application/json: {schema: {$ref: '#/components/schemas/NotificationBindingStarted'}}}, description: Verification message sent.}, default: {$ref: '#/components/responses/Error'}}, summary: Begin Notification Channel Verification}}
  /me/notifications/bindings/confirm: {post: {operationId: confirmNotificationBinding, security: [{sessionCookie: []}], requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/NotificationBindingConfirm'}}}, required: true}, responses: {"200": {content: {application/json: {schema: {$ref: '#/components/schemas/UserNotificationSettings'}}}, description: Channel verified.}, default: {$ref: '#/components/responses/Error'}}, summary: Confirm Notification Channel}}
  /me/notifications/bindings/{kind}: {delete: {operationId: removeNotificationBinding, security: [{sessionCookie: []}], parameters: [{name: kind, in: path, required: true, schema: {type: string, enum: [email, telegram]}}], responses: {"204": {description: Channel removed.}, default: {$ref: '#/components/responses/Error'}}, summary: Remove Notification Channel}}
  /me/password: {patch: {operationId: changePassword, security: [{sessionCookie: []}], x-recent-auth: true, requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/PasswordChangeRequest'}}}, required: true}, responses: {"200": {content: {application/json: {schema: {$ref: '#/components/schemas/CSRFResponse'}}}, description: Successful response.}, default: {$ref: '#/components/responses/Error'}}, summary: Change Password}}
  /me/dashboard:
    get:
      operationId: getDashboard
      description: "Overview of the caller's own private collection: distinct live bookmark count, duplicate count, last Floccus contact and the last seven days of changes (current item state, newest first, paginated). Never includes shared folders or other users' data; the share selector is rejected."
      security: [{sessionCookie: []}, {personalToken: []}]
      x-token-scope: bookmarks:read
      parameters:
        - in: query
          name: page
          description: Zero-based page of recent change items.
          required: false
          schema: {default: 0, format: int64, maximum: 1000000, minimum: 0, type: integer}
        - in: query
          description: The handler caps the effective page size at 200; larger values are accepted.
          name: limit
          required: false
          schema: {default: 20, format: int64, minimum: 1, type: integer}
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
          description: Successful response.
        default:
          $ref: '#/components/responses/Error'
      summary: Get Dashboard
  /me/settings: {get: {operationId: getSettings, security: [{sessionCookie: []}], responses: {"200": {content: {application/json: {schema: {$ref: '#/components/schemas/SettingsResponse'}}}, description: Successful response.}, default: {$ref: '#/components/responses/Error'}}, summary: Get Settings}, patch: {operationId: updateSettings, security: [{sessionCookie: []}], responses: {"200": {content: {application/json: {schema: {$ref: '#/components/schemas/SettingsResponse'}}}, description: Successful response.}, default: {$ref: '#/components/responses/Error'}}, requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/SettingsPatchRequest'}}}, required: true}, summary: Update Settings}}
