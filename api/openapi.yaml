  /me/tokens/{id}: {delete: {operationId: revokeToken, security: [{sessionCookie: []}], responses: {"204": {description: No content.}, default: {$ref: '#/components/responses/Error'}}, summary: Revoke Token, parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}]}}
