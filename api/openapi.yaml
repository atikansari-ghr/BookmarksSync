  /index.php/login/v2:
    post:
      servers: [{url: /}]
      operationId: beginLoginFlow
      summary: Begin an app connection
      description: Anonymous Nextcloud Login Flow v2 initiation. Returns independent browser and poll handles valid for 20 minutes. State and per-peer requests are bounded.
      security: []
      x-public: true
      responses:
        "200":
          description: Open the login URL and poll the returned endpoint.
          content:
            application/json:
              schema:
                type: object
                required: [poll, login]
                properties:
                  login: {type: string, format: uri}
                  poll:
                    type: object
                    required: [token, endpoint]
                    properties:
                      token: {type: string}
                      endpoint: {type: string, format: uri}
        default: {$ref: '#/components/responses/Error'}
  /login/v2/poll:
    post:
      servers: [{url: /}]
      operationId: pollLoginFlow
      summary: Redeem an approved app connection once
      description: Returns 404 while pending, expired or consumed. A successful response is returned once and contains a revocable private edit app credential. Responses are never cached.
      security: []
      x-public: true
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}
      responses:
        "200":
          description: One-time application credentials.
          content:
            application/json:
              schema:
                type: object
                required: [server, loginName, appPassword]
                properties:
                  server: {type: string, format: uri}
                  loginName: {type: string}
                  appPassword: {type: string}
        default: {$ref: '#/components/responses/Error'}
  /auth/connect:
    get:
      operationId: inspectLoginFlow
      summary: Check a browser connection request
      security: [{sessionCookie: []}]
      parameters:
        - {name: flow, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: Request awaits explicit consent.
          content:
            application/json:
              schema: {type: object, required: [status], properties: {status: {type: string, const: pending}}}
        default: {$ref: '#/components/responses/Error'}
  /auth/connect/continuation:
    get:
      operationId: continueLoginFlow
      summary: Resume an app connection after provider sign-in
      security: [{sessionCookie: []}]
      responses:
        "200":
          description: Allowlisted local destination; clears the HttpOnly continuation cookie.
          content:
            application/json:
              schema: {type: object, required: [destination], properties: {destination: {type: string}}}
        default: {$ref: '#/components/responses/Error'}
  /auth/connect/approve:
    post:
      operationId: approveLoginFlow
      summary: Approve a private edit app connection
      security: [{sessionCookie: []}]
      x-recent-auth: true
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [flow, sessionId], additionalProperties: false, properties: {flow: {type: string}, sessionId: {type: integer, format: int64}, label: {type: string, minLength: 1, maxLength: 200, description: 'Optional connection name for the minted credential, such as the client profile name. Surrounding white space is trimmed and the result must be 1-200 characters without control characters. When omitted the legacy name "Login Flow v2 connection" is used.'}}}
      responses:
        "200":
          description: Approved for the requesting client to redeem; no credentials returned to this browser.
          content:
            application/json:
              schema: {type: object, required: [status], properties: {status: {type: string, const: approved}}}
        default: {$ref: '#/components/responses/Error'}
