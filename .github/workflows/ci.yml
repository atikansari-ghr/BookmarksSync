name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to full commit SHAs, verified against the official
# actions/* repositories (tag -> commit) on 2026-11-16. All three run on node24.
#   actions/checkout   v7.0.1 3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/setup-go   v7.0.0 b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
#   actions/setup-node v7.1.0 949feb2413d6458794dcd2491c4babbbce0c15c1
# govulncheck is pinned to golang.org/x/vuln v1.9.0 (Go module proxy @latest).
# Node 26 (LTS "Lithium") satisfies selenium-webdriver 4.46.0 and playwright
# 1.65.1, which declare engines node >=20.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test with race detector
        env:
          CGO_ENABLED: "1" # the race detector requires cgo
        run: go test -race ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: govulncheck
        run: govulncheck ./...

  browser-harness:
    # Unit suites only: no browsers, extension assets or network services needed.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: tests/browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Install (lockfile)
        run: npm ci
      - name: Chrome harness unit tests
        run: npm test
      - name: Firefox harness unit tests
        run: npm run test:firefox

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: npm audit (high and above)
        run: npm audit --audit-level=high
      - name: npm audit web UI runtime dependencies (high and above)
        # Gates only what ships in the embedded UI (react, react-dom). As of
        # 2026-11-17 every picomatch release (used by the Vite/Vitest build and test
        # tooling on trusted config globs, never shipped) carries GHSA-fc5q-39xc-vjpf
        # with no patched version; see the Task 6 report.
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  web:
    # The sign-in UI (web/) is built into internal/webui/static and embedded in the
    # Go binary. The committed build must match a fresh build from the lockfile.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install (lockfile)
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Component and flow tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Embedded build is up to date
        working-directory: .
        run: |
          git add --intent-to-add internal/webui/static
          git diff --exit-code --stat -- internal/webui/static

  build:
    needs: [test, race, govulncheck, browser-harness, npm-audit, web]
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          COMMIT: ${{ github.sha }}
          OUT: dist/bookmarksync-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
        run: |
          # Commit-based build date keeps builds reproducible for a given SHA.
          BUILD_DATE="$(git show -s --format=%cI "$COMMIT")"
          pkg=github.com/atikansari-ghr/BookmarksSync/internal/version
          go build -trimpath \
            -ldflags "-s -w -X ${pkg}.Version=0.0.0-ci -X ${pkg}.Commit=${COMMIT} -X ${pkg}.Date=${BUILD_DATE}" \
            -o "$OUT" ./cmd/bookmarksync
